name: Forward Duality agent summaries to Discord

on:
  push:
    branches:
      - agent-reports
    paths:
      - agent-reports/latest.md

permissions:
  contents: read

jobs:
  notify:
    if: github.actor == 'Jmiller47904' && startsWith(github.event.head_commit.message, 'agent-report:')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Send summary to Discord
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.request
from urllib.error import HTTPError

          webhook = os.environ.get("DISCORD_WEBHOOK_URL")
          if not webhook:
              raise SystemExit("DISCORD_WEBHOOK_URL secret is not configured")
          with open("agent-reports/latest.md", encoding="utf-8") as report_file:
              report = report_file.read().strip()
          prefix = "**Duality Build Agent**\n"
          content = prefix + report
          if len(content) > 1900:
              content = content[:1897] + "..."
          payload = json.dumps({
              "content": content,
              "allowed_mentions": {"parse": []},
          }).encode("utf-8")
          request = urllib.request.Request(
              webhook,
              data=payload,
              headers={"Content-Type": "application/json"},
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status not in (200, 204):
                  raise SystemExit(f"Discord returned unexpected status {response.status}")
          PY
