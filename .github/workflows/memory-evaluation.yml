name: Paired Memory Evaluation

on:
  pull_request:
    branches: [main, develop]
    paths:
      - "src/drai/**"
      - "benchmarks/memory_evaluation/**"
      - ".github/workflows/memory-evaluation.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: memory-evaluation-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  HF_HUB_DISABLE_TELEMETRY: "1"
  TOKENIZERS_PARALLELISM: "false"

jobs:
  paired-evaluation:
    name: Pythia-410M paired memory conditions
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache model files
        uses: actions/cache@v5
        with:
          path: .cache/huggingface
          key: hf-pythia-410m-memory-evaluation-${{ runner.os }}-${{ hashFiles('benchmarks/memory_evaluation/**', 'src/drai/**', 'pyproject.toml') }}

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Run paired evaluation
        run: |
          python benchmarks/memory_evaluation/run.py \
            --model EleutherAI/pythia-410m \
            --output memory-evaluation-results.json

      - name: Publish evaluation report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: paired-memory-evaluation
          path: memory-evaluation-results.json
          if-no-files-found: ignore
          retention-days: 30
