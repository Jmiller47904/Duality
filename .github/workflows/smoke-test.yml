name: V1 Smoke Test

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "benchmarks/quick_validation/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/smoke-test.yml"
  pull_request:
    paths:
      - "src/**"
      - "benchmarks/quick_validation/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/smoke-test.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v1-smoke-${{ github.ref }}
  cancel-in-progress: true

env:
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
  TOKENIZERS_PARALLELISM: "false"

jobs:
  quick-validation:
    name: Pythia-70M DRAI smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache Hugging Face model files
        uses: actions/cache@v5
        with:
          path: .cache/huggingface
          key: hf-pythia-70m-${{ runner.os }}-${{ hashFiles('benchmarks/quick_validation/smoke_test.py', 'pyproject.toml') }}

      - name: Install runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install --no-cache-dir numpy transformers
          python -m pip install --no-deps --no-cache-dir -e .

      - name: Run quick validation
        run: python benchmarks/quick_validation/smoke_test.py
