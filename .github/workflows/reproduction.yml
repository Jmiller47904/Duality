name: Reproduce Story Comprehension Result

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 0"

permissions:
  contents: read

env:
  HF_HOME: ${{ github.workspace }}/.cache/huggingface
  TRANSFORMERS_CACHE: ${{ github.workspace }}/.cache/huggingface
  TOKENIZERS_PARALLELISM: "false"

jobs:
  reproduce:
    name: Pythia-410M story comprehension
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Cache Hugging Face model files
        uses: actions/cache@v5
        with:
          path: .cache/huggingface
          key: hf-pythia-410m-${{ runner.os }}-${{ hashFiles('benchmarks/story_comprehension_410m/**', 'src/**', 'pyproject.toml') }}

      - name: Install runtime and model-loading dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . accelerate

      - name: Validate shell script syntax
        run: bash -n scripts/run_reproduction_410m.sh

      - name: Run the reproducibility benchmark
        run: bash scripts/run_reproduction_410m.sh

      - name: Publish benchmark results
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: story-comprehension-results
          path: benchmarks/story_comprehension_410m/results
          if-no-files-found: ignore
          retention-days: 30
