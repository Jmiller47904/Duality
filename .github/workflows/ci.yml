name: CI

on:
  push:
    branches: [main, develop]
    paths:
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "requirements.txt"
      - ".github/workflows/**"
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-contract:
    name: Python ${{ matrix.python-version }} package contract
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Compile active source and benchmark code
        run: |
          python -m compileall -q src benchmarks tests

      - name: Exercise the active V1 public contract
        run: |
          python - <<'PY'
          import torch

          from src.drai import (
              DRAIV1ResonanceLayer,
              V1Config,
              apply_v1,
              get_v1_conservative,
              get_v1_stats,
          )
          from duality_lm import ByteTokenizer, DualityLM, DualityLMConfig

          config = get_v1_conservative()
          assert isinstance(config, V1Config)
          assert config.algorithm_type == "v1"
          assert config.resolve_layers(24) == [11, 12]

          layer = DRAIV1ResonanceLayer(
              hidden_size=128,
              num_heads=2,
              head_dim=8,
              max_attractors=4,
              burn_in_threshold=0.0,
          )
          query = torch.randn(3, 2, 4, 8)
          keys, values = layer(query)

          assert keys.shape == (3, 2, 2, 8)
          assert values.shape == (3, 2, 2, 8)
          assert torch.isfinite(keys).all()
          assert torch.isfinite(values).all()
          assert layer.timestep.item() == 1.0

          stats = layer.get_stats()
          assert stats["num_alive"] > 0
          assert stats["timestep"] == 1.0

          assert callable(apply_v1)
          assert callable(get_v1_stats)

          tokenizer = ByteTokenizer()
          native = DualityLM(
              DualityLMConfig.tiny(
                  vocab_size=tokenizer.vocab_size,
                  max_seq_len=64,
              )
          )
          tokens = torch.tensor([tokenizer.encode("Duality")])
          native_output = native(tokens, use_cache=True)
          assert native_output.logits.shape == (1, tokens.shape[1], tokenizer.vocab_size)
          assert native_output.memory_state is not None
          assert native_output.past_key_values is not None

          print("Active DRAI V1 API contract passed")
          print("Native DualityLM API contract passed")
          PY

  environment-tests:
    name: PyTorch environment tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run PyTorch and transformer primitives
        run: python -m pytest tests/environment/test_pytorch_installation.py

  native-duality-tests:
    name: Native DualityLM and persistent cognition
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run native model and continuity tests
        run: |
          python -m pytest \
            tests/unit/test_duality_lm.py \
            tests/unit/test_persistent_cognition.py

  legacy-unit-tests:
    name: Legacy Phase 2 unit tests (informational)
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run the committed Phase 2 test suite
        id: legacy-tests
        shell: bash
        run: |
          set +e
          python -m pytest tests/unit
          exit_code=$?
          if [ "$exit_code" -ne 0 ]; then
            echo "::warning::The archived Phase 2 suite exited with code $exit_code; this check is informational."
          fi
          exit 0

      - name: Explain a legacy-suite failure
        if: always()
        run: |
          echo "The committed tests/unit suite targets the archived Phase 2 API."
          echo "The active package exposes the production V1 API instead."
          echo "The legacy suite is intentionally non-blocking until those tests are migrated."
